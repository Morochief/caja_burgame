<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgame — Sistema de Gestión</title>
    <meta name="description" content="Sistema de gestión para Burgame, hamburguesería con temática de videojuegos.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Preconnect a Supabase (acelera handshake TLS del primer fetch) -->
    <link rel="preconnect" href="https://vgpaexxlxexegnivfxgj.supabase.co">
    <link rel="dns-prefetch" href="https://cdn.sheetjs.com">

    <!-- Lucide Icons (versión fija + defer para no bloquear render) -->
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js" defer></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/dashboard.css">
    <link rel="stylesheet" href="css/pages/ventas.css">
    <link rel="stylesheet" href="css/pages/ordenes.css">
    <link rel="stylesheet" href="css/pages/menu.css">
    <link rel="stylesheet" href="css/pages/caja.css">
    <link rel="stylesheet" href="css/pages/gastos.css">
    <link rel="stylesheet" href="css/pages/reportes.css">
    <link rel="stylesheet" href="css/pages/ajustes.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <link rel="stylesheet" href="css/pages/clientes.css">
    <link rel="stylesheet" href="css/pages/arcade.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="BurgameLogoTrazoAmarillo.png">
</head>
<body class="bg-dark text-main">
    <div class="app-layout">
        <!-- Mobile Top Navbar -->
        <header class="mobile-header">
            <button id="btn-toggle-sidebar" class="mobile-header__btn" aria-label="Abrir menú">
                <i data-lucide="menu"></i>
            </button>
            <div class="mobile-header__logo">
                <img src="BurgameLogoTrazoAmarillo.png" alt="Burgame" class="mobile-header__logo-img">
                <span class="mobile-header__title">BURGAME</span>
            </div>
            <a href="cocina.html" target="_blank" class="mobile-header__kitchen-btn" title="Pantalla Cocina">
                👨‍🍳
            </a>
        </header>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar__logo">
                <img src="BurgameLogoTrazoAmarillo.png" alt="Burgame" class="sidebar__logo-img">
                <span class="sidebar__logo-text">BURGAME</span>
            </div>

            <nav class="sidebar__nav" id="sidebar-nav">
                <!-- Navigation items & footer rendered dynamically by sidebar.js -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <div id="page-container" class="page-container">
                <!-- Pages rendered here by router -->
                <div class="page-loading">
                    <div class="pixel-spinner"></div>
                    <p>Cargando...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-container"></div>

    <!-- App Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
